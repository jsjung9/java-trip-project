server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thememap?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:thememap}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=ThemeMapPool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false

mybatis.config-location=classpath:mybatis/mybatisConfig.xml

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET_KEY}
jwt.access-token.expiretime=${JWT_ACCESS_EXPIRED:3600000}
jwt.refresh-token.expiretime=${JWT_REFRESH_EXPIRED:2592000000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.root=info
logging.level.com.ssafy=${APP_LOG_LEVEL:info}
