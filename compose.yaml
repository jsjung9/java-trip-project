services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: thememap
      MYSQL_USER: thememap
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - thememap-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./ThemeMap
    environment:
      DB_URL: jdbc:mysql://database:3306/thememap?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: thememap
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./theme-map
      args:
        VITE_SERVER_URL: http://localhost:8080
        VITE_KAKAO_MAP_SCRIPT_URL: ${VITE_KAKAO_MAP_SCRIPT_URL}
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  thememap-db:
